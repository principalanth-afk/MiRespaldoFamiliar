name: Compilar APK

# Se ejecuta cada vez que subes cambios, o manualmente desde la pestaña "Actions"
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permiso al gradlew
        run: chmod +x ./gradlew

      - name: Compilar el APK (release)
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: MiRespaldo-APK
          path: app/build/outputs/apk/release/*.apk

      # También lo publica en "Releases" para que sea fácil de descargar al celular
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MiRespaldo v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
